// Utility functions
function mkKey(name) { return String(name || "").trim().toLowerCase(); }

function colorFromName(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  const hue = Math.abs(hash % 360);
  return `hsl(${hue}, 62%, 58%)`;
}

function fmtTime(ts) {
  const now = new Date();
  const date = new Date(ts);
  const diff = now - date;

  if (diff < 86400000 && now.getDate() === date.getDate()) {
    return date.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  } else if (diff < 604800000) {
    return date.toLocaleDateString([], {weekday: 'short', hour: "2-digit", minute: "2-digit"});
  } else {
    return date.toLocaleDateString([], {month: 'short', day: 'numeric', hour: "2-digit", minute: "2-digit"});
  }
}

function fmtDateDivider(ts) {
  const date = new Date(ts);
  const now = new Date();
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (sameDay(date, now)) return "Today";
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  if (sameDay(date, yesterday)) return "Yesterday";
  return date.toLocaleDateString([], { month: 'long', day: 'numeric', year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
}

function lastSeenText(ts) {
  if (!ts) return "offline";
  const diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 30) return "online";
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatText(text) {
  const escaped = escapeHtml(text);
  return escaped
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/@(\w+)/g, '<span class="mention">@$1</span>')
    .replace(/\n/g, '<br>');
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escaped.replace(new RegExp(`(${escapedQuery})`, 'ig'), '<mark>$1</mark>');
}

// Typing indicators
let typingTimeout;
async function startTyping() {

  const typingUserRef = dbRef(db, `${TYPING_PATH}/${state.currentUser.name}`);
  await set(typingUserRef, { typing: true, timestamp: serverTimestamp() });
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(async () => { await remove(typingUserRef); }, 3000);
}

async function stopTyping() {
  if (!state.currentUser) return;
  const typingUserRef = dbRef(db, `${TYPING_PATH}/${state.currentUser.name}`);
  await remove(typingUserRef);
  clearTimeout(typingTimeout);
}

function updateTypingIndicator() {
  const typingUsers = Object.entries(state.typing)
    .filter(([user, data]) => user !== state.currentUser?.name && data.typing)
    .map(([user]) => user);

  const indicator = elements.typingIndicator;
  if (!indicator) return;

  if (typingUsers.length === 0) {
    indicator.classList.remove('show');
    indicator.innerHTML = '';
  } else {
    indicator.classList.add('show');
    const text = typingUsers.length === 1
      ? `${typingUsers[0]} is typing`
      : typingUsers.length === 2
      ? `${typingUsers[0]} and ${typingUsers[1]} are typing`
      : `${typingUsers.length} people are typing`;
    indicator.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span> ${text}`;
  }
}


// Profile photo (local stage)
function profileStorageKey(username) {
  return `accea-profile-photo-${mkKey(username)}`;
}

function getProfilePhoto(username) {
  if (!username) return '';
  return localStorage.getItem(profileStorageKey(username)) || '';
}

function applyAvatarElement(el, username, photo = '') {
  if (!el) return;

  const src = photo || getProfilePhoto(username);
  const existingImg = el.querySelector('.avatar-photo');

  if (src) {
    if (existingImg) {
      existingImg.src = src;
    } else {
      const img = document.createElement('img');
      img.className = 'avatar-photo';
      img.src = src;
      img.alt = `Foto de ${username || 'usuário'}`;
      img.draggable = false;
      el.appendChild(img);
    }
    el.classList.add('has-profile-photo');
    el.style.backgroundImage = '';
    el.style.background = 'var(--bg-tertiary)';
    return;
  }

  if (existingImg) existingImg.remove();
  el.classList.remove('has-profile-photo');
  el.style.backgroundImage = '';
  el.style.background = colorFromName(username || '?');
  el.textContent = initials(username);
}

function applyMessageAvatar(el, username, photo = '') {
  if (!el) return;
  const src = photo || getProfilePhoto(username);
  if (src) {
    el.innerHTML = `<img class="avatar-photo" src="${src}" alt="Foto de ${username || 'usuário'}">`;
    el.classList.add('has-profile-photo');
  } else {
    el.classList.remove('has-profile-photo');
    el.textContent = initials(username);
  }
}

function refreshProfilePhotoUI(username) {
  const photo = getProfilePhoto(username);

  if (state.userMap[username]) {
    state.userMap[username].profile = {
      ...(state.userMap[username].profile || {}),
      avatarUrl: photo
    };
  }

  if (state.currentUser?.name === username) {
    applyAvatarElement(elements.meAvatar, username, photo);
  }

  document.querySelectorAll('.user-item').forEach(row => {
    if (row.dataset.username !== username) return;
    const avatar = row.querySelector('.user-avatar');
    applyAvatarElement(avatar, username, photo);
  });

  document.querySelectorAll('.message-wrapper').forEach(wrapper => {
    if (wrapper.dataset.author !== username) return;
    const avatar = wrapper.querySelector('.msg-avatar');
    applyMessageAvatar(avatar, username, photo);
  });
}

function handleProfilePhoto(file) {
  if (!state.currentUser || !file) return;

  if (!file.type.startsWith('image/')) {
    showNotification('Escolha uma imagem para a foto de perfil.', 'error');
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    showNotification('A foto de perfil deve ter no máximo 5MB.', 'warning');
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    const src = reader.result;

    try {
      localStorage.setItem(profileStorageKey(state.currentUser.name), src);
      refreshProfilePhotoUI(state.currentUser.name);
      showNotification('Foto de perfil atualizada.', 'success');
    } catch (error) {
      showNotification('Não foi possível salvar essa foto. Tente uma imagem menor.', 'error');
    }
  };

  reader.onerror = () => {
    showNotification('Não foi possível carregar a foto.', 'error');
  };

  reader.readAsDataURL(file);
}

function removeProfilePhoto() {
  if (!state.currentUser) return;

  const key = profileStorageKey(state.currentUser.name);
  localStorage.removeItem(key);
  refreshProfilePhotoUI(state.currentUser.name);
  showNotification('Foto de perfil removida.', 'success');
}

function initials(name) {
  return (name || '?')[0].toUpperCase();
}

function socialStorageKey(username) {
  return `accea-social-${mkKey(username)}`;
}

function defaultSocialState() {
  return {
    friends: [],
    incoming: [],
    outgoing: [],
    groups: [],
    chats: {}
  };
}

function loadSocialState(username) {
  if (!username) return defaultSocialState();
  try {
    const raw = localStorage.getItem(socialStorageKey(username));
    if (!raw) return defaultSocialState();
    const parsed = JSON.parse(raw);
    return {
      ...defaultSocialState(),
      ...parsed,
      friends: Array.isArray(parsed.friends) ? parsed.friends : [],
      incoming: Array.isArray(parsed.incoming) ? parsed.incoming : [],
      outgoing: Array.isArray(parsed.outgoing) ? parsed.outgoing : [],
      groups: Array.isArray(parsed.groups) ? parsed.groups : [],
      chats: parsed.chats && typeof parsed.chats === 'object' ? parsed.chats : {}
    };
  } catch {
    return defaultSocialState();
  }
}

function makeSocialStorageSafe(social) {
  const safe = { ...social, chats: {} };
  Object.entries(social.chats || {}).forEach(([id, chat]) => {
    safe.chats[id] = {
      ...chat,
      messages: (chat.messages || []).map(msg => {
        if (msg.type === 'image' || msg.type === 'video') {
          return { ...msg, data: typeof msg.data === 'string' && msg.data.length <= 180000 ? msg.data : '' };
        }
        return msg;
      })
    };
  });
  return safe;
}

function saveSocialStateForUser(username, social) {
  try {
    localStorage.setItem(socialStorageKey(username), JSON.stringify(makeSocialStorageSafe(social)));
    return true;
  } catch {
    return false;
  }
}

function saveSocialState() {
  if (!state.currentUser) return;
  if (!saveSocialStateForUser(state.currentUser.name, state.social)) {
    showNotification('Não foi possível salvar as alterações locais.', 'warning');
  }
}

function ensureChat(chatId, meta = {}) {
  if (!state.social.chats[chatId]) {
    state.social.chats[chatId] = {
      type: meta.type || 'private',
      name: meta.name || chatId,
      participants: Array.isArray(meta.participants) ? meta.participants : [],
      messages: []
    };
  } else {
    state.social.chats[chatId] = {
      ...state.social.chats[chatId],
      ...meta,
      messages: Array.isArray(state.social.chats[chatId].messages) ? state.social.chats[chatId].messages : []
    };
  }
  return state.social.chats[chatId];
}

function getPrivateChatId(a, b) {
  return `p:${[mkKey(a), mkKey(b)].sort().join('|')}`;
}

function getFriendRequestCount() {
  return state.social.incoming.length;
}

function isFriend(username) {
  return state.social.friends.includes(mkKey(username));
}

function isOutgoing(username) {
  return state.social.outgoing.includes(mkKey(username));
}

function isIncoming(username) {
  return state.social.incoming.includes(mkKey(username));
}

function friendshipKey(a, b) {
  return [mkKey(a), mkKey(b)].sort().join('__');
}

function clearSocialFirebaseListeners() {
  socialFirebaseUnsubs.forEach(unsub => {
    try { unsub(); } catch {}
  });
  socialFirebaseUnsubs = [];
}

function applyFriendshipsSnapshot(snapshot) {
  const me = mkKey(state.currentUser?.name);
  if (!me) return;
  const data = snapshot.exists() ? snapshot.val() : {};
  const friends = [];
  Object.values(data || {}).forEach(pair => {
    const a = mkKey(pair?.a);
    const b = mkKey(pair?.b);
    if (a === me && b) friends.push(b);
    else if (b === me && a) friends.push(a);
  });
  state.social.friends = [...new Set(friends)].sort();
  saveSocialState();
  renderFriendsUI();
  renderConversationList();
}

function applyIncomingRequestsSnapshot(snapshot) {
  const data = snapshot.exists() ? snapshot.val() : {};
  state.social.incoming = Object.keys(data || {}).map(mkKey).filter(Boolean).sort();
  saveSocialState();
  renderFriendsUI();
}

function attachSocialFirebaseListeners() {
  clearSocialFirebaseListeners();
  const me = mkKey(state.currentUser?.name);
  if (!me) return;

  const incomingRef = dbRef(db, `${FRIEND_REQUESTS_PATH}/${me}`);
  socialFirebaseUnsubs.push(onValue(incomingRef, applyIncomingRequestsSnapshot, (error) => {
    console.warn('Não foi possível ler solicitações de amizade:', error);
  }));

  socialFirebaseUnsubs.push(onValue(friendshipsRef, applyFriendshipsSnapshot, (error) => {
    console.warn('Não foi possível ler amizades do Firebase:', error);
  }));
}

async function addFriendRequest(username) {
  const target = mkKey(username);
  const me = mkKey(state.currentUser?.name);
  if (!target || target === me) {
    showNotification('Digite outra pessoa além de você.', 'warning');
    return false;
  }
  if (!state.currentUser?.uid) {
    showNotification('Sua sessão ainda não está pronta.', 'warning');
    return false;
  }

  try {
    const targetSnap = await get(child(usersRef, target));
    if (!targetSnap.exists()) {
      showNotification(`A conta @${target} ainda não está sincronizada. Peça para a pessoa entrar novamente no ACCEA.`, 'warning');
      return false;
    }

    const pairSnap = await get(child(friendshipsRef, friendshipKey(me, target)));
    if (pairSnap.exists()) {
      showNotification('Essa pessoa já está nos seus amigos.', 'info');
      return false;
    }

    const requestPath = `${FRIEND_REQUESTS_PATH}/${target}/${me}`;
    const requestSnap = await get(dbRef(db, requestPath));
    if (requestSnap.exists()) {
      showNotification('Solicitação já enviada.', 'info');
      return false;
    }

    await set(dbRef(db, requestPath), {
      from: me,
      to: target,
      createdAt: serverTimestamp()
    });

    // Mantém um pequeno cache local para a UI continuar instantânea.
    if (!state.social.outgoing.includes(target)) state.social.outgoing.push(target);
    saveSocialState();
    renderFriendsUI();
    renderConversationList();
    showNotification(`Solicitação enviada para ${target}.`, 'success');
    return true;
  } catch (error) {
    console.error(error);
    showNotification('Não foi possível enviar a solicitação. Verifique a conexão com o Firebase.', 'error');
    return false;
  }
}

async function acceptFriend(username) {
  const target = mkKey(username);
  const me = mkKey(state.currentUser?.name);
  if (!target || !me) return;

  try {
    const requestSnap = await get(dbRef(db, `${FRIEND_REQUESTS_PATH}/${me}/${target}`));
    if (!requestSnap.exists()) {
      showNotification('Essa solicitação não está mais disponível.', 'warning');
      return;
    }

    await set(dbRef(db, `${FRIENDSHIPS_PATH}/${friendshipKey(me, target)}`), {
      a: [me, target].sort()[0],
      b: [me, target].sort()[1],
      createdAt: serverTimestamp()
    });
    await remove(dbRef(db, `${FRIEND_REQUESTS_PATH}/${me}/${target}`));

    state.social.incoming = state.social.incoming.filter(x => x !== target);
    state.social.outgoing = state.social.outgoing.filter(x => x !== target);
    saveSocialState();
    renderFriendsUI();
    renderConversationList();
    showNotification(`${target} agora é seu amigo.`, 'success');
  } catch (error) {
    console.error(error);
    showNotification('Não foi possível aceitar a solicitação.', 'error');
  }
}

async function declineFriend(username) {
  const target = mkKey(username);
  const me = mkKey(state.currentUser?.name);
  if (!target || !me) return;

  try {
    await remove(dbRef(db, `${FRIEND_REQUESTS_PATH}/${me}/${target}`));
    state.social.incoming = state.social.incoming.filter(x => x !== target);
    saveSocialState();
    renderFriendsUI();
    showNotification('Solicitação recusada.', 'success');
  } catch (error) {
    console.error(error);
    showNotification('Não foi possível recusar a solicitação.', 'error');
  }
}
