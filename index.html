// Utility functions
function mkKey(name) { return String(name || "").trim().toLowerCase(); }

function colorFromName(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  const hue = Math.abs(hash % 360);
  return `hsl(${hue}, 62%, 58%)`;
}

function fmtTime(ts) {
  const now = new Date();
  const date = new Date(ts);
  const diff = now - date;

  if (diff < 86400000 && now.getDate() === date.getDate()) {
    return date.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  } else if (diff < 604800000) {
    return date.toLocaleDateString([], {weekday: 'short', hour: "2-digit", minute: "2-digit"});
  } else {
    return date.toLocaleDateString([], {month: 'short', day: 'numeric', hour: "2-digit", minute: "2-digit"});
  }
}

function fmtDateDivider(ts) {
  const date = new Date(ts);
  const now = new Date();
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (sameDay(date, now)) return "Today";
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  if (sameDay(date, yesterday)) return "Yesterday";
  return date.toLocaleDateString([], { month: 'long', day: 'numeric', year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
}

function lastSeenText(ts) {
  if (!ts) return "offline";
  const diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 30) return "online";
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatText(text) {
  const escaped = escapeHtml(text);
  return escaped
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/@(\w+)/g, '<span class="mention">@$1</span>')
    .replace(/\n/g, '<br>');
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escaped.replace(new RegExp(`(${escapedQuery})`, 'ig'), '<mark>$1</mark>');
}

// Presence management
async function setPresence(username) {
  if (!username) return;
  const statusRef = dbRef(db, `${USERS_PATH}/${username}/status`);
  await set(statusRef, {
    online: true,
    lastSeen: serverTimestamp(),
    typing: false
  });
  onDisconnect(statusRef).set({
    online: false,
    lastSeen: serverTimestamp(),
    typing: false
  });
}

// Typing indicators
let typingTimeout;
async function startTyping() {
  if (!state.currentUser) return;
  const typingUserRef = dbRef(db, `${TYPING_PATH}/${state.currentUser.name}`);
  await set(typingUserRef, { typing: true, timestamp: serverTimestamp() });
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(async () => { await remove(typingUserRef); }, 3000);
}

async function stopTyping() {
  if (!state.currentUser) return;
  const typingUserRef = dbRef(db, `${TYPING_PATH}/${state.currentUser.name}`);
  await remove(typingUserRef);
  clearTimeout(typingTimeout);
}

function updateTypingIndicator() {
  const typingUsers = Object.entries(state.typing)
    .filter(([user, data]) => user !== state.currentUser?.name && data.typing)
    .map(([user]) => user);

  const indicator = elements.typingIndicator;
  if (!indicator) return;

  if (typingUsers.length === 0) {
    indicator.classList.remove('show');
    indicator.innerHTML = '';
  } else {
    indicator.classList.add('show');
    const text = typingUsers.length === 1
      ? `${typingUsers[0]} is typing`
      : typingUsers.length === 2
      ? `${typingUsers[0]} and ${typingUsers[1]} are typing`
      : `${typingUsers.length} people are typing`;
    indicator.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span> ${text}`;
  }
}


// Profile photo (local stage)
function profileStorageKey(username) {
  return `accea-profile-photo-${mkKey(username)}`;
}

function getProfilePhoto(username) {
  if (!username) return '';
  return localStorage.getItem(profileStorageKey(username)) || '';
}

function applyAvatarElement(el, username, photo = '') {
  if (!el) return;

  const src = photo || getProfilePhoto(username);
  const existingImg = el.querySelector('.avatar-photo');

  if (src) {
    if (existingImg) {
      existingImg.src = src;
    } else {
      const img = document.createElement('img');
      img.className = 'avatar-photo';
      img.src = src;
      img.alt = `Foto de ${username || 'usuário'}`;
      img.draggable = false;
      el.appendChild(img);
    }
    el.classList.add('has-profile-photo');
    el.style.backgroundImage = '';
    el.style.background = 'var(--bg-tertiary)';
    return;
  }

  if (existingImg) existingImg.remove();
  el.classList.remove('has-profile-photo');
  el.style.backgroundImage = '';
  el.style.background = colorFromName(username);

  const statusIndicator = el.querySelector('.status-indicator');
  el.textContent = initials(username);
  if (statusIndicator) el.appendChild(statusIndicator);
}

function applyMessageAvatar(el, username, photo = '') {
  if (!el) return;
  const src = photo || getProfilePhoto(username);
  el.classList.add('msg-avatar');
  el.innerHTML = '';
  el.style.background = colorFromName(username);

  if (src) {
    const img = document.createElement('img');
    img.className = 'avatar-photo';
    img.src = src;
    img.alt = `Foto de ${username || 'usuário'}`;
    img.draggable = false;
    el.appendChild(img);
    el.classList.add('has-profile-photo');
  } else {
    el.classList.remove('has-profile-photo');
    el.textContent = initials(username);
  }
}

function refreshProfilePhotoUI(username) {
  const photo = getProfilePhoto(username);

  if (state.userMap[username]) {
    state.userMap[username].profile = {
      ...(state.userMap[username].profile || {}),
      avatarUrl: photo
    };
  }

  if (state.currentUser?.name === username) {
    applyAvatarElement(elements.meAvatar, username, photo);
  }

  document.querySelectorAll('.user-item').forEach(row => {
    if (row.dataset.username !== username) return;
    const avatar = row.querySelector('.user-avatar');
    applyAvatarElement(avatar, username, photo);
  });

  document.querySelectorAll('.message-wrapper').forEach(wrapper => {
    if (wrapper.dataset.author !== username) return;
    const avatar = wrapper.querySelector('.msg-avatar');
    applyMessageAvatar(avatar, username, photo);
  });
}

function handleProfilePhoto(file) {
  if (!state.currentUser || !file) return;

  if (!file.type.startsWith('image/')) {
    showNotification('Escolha uma imagem para a foto de perfil.', 'error');
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    showNotification('A foto de perfil deve ter no máximo 5MB.', 'warning');
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    const src = reader.result;

    try {
      localStorage.setItem(profileStorageKey(state.currentUser.name), src);
      refreshProfilePhotoUI(state.currentUser.name);
      showNotification('Foto de perfil atualizada.', 'success');
    } catch (error) {
      showNotification('Não foi possível salvar essa foto. Tente uma imagem menor.', 'error');
    }
  };

  reader.onerror = () => {
    showNotification('Não foi possível carregar a foto.', 'error');
  };

  reader.readAsDataURL(file);
}

function removeProfilePhoto() {
  if (!state.currentUser) return;

  const key = profileStorageKey(state.currentUser.name);
  localStorage.removeItem(key);
  refreshProfilePhotoUI(state.currentUser.name);
  showNotification('Foto de perfil removida.', 'success');
}

// User management
async function createUser(username, pass, role = "user") {
  const key = mkKey(username);
  if (!key || !pass) {
    showNotification('Enter a username and password first.', 'warning');
    return;
  }
  try {
    await set(child(usersRef, key), {
      pass: String(pass),
      role,
      profile: {
        avatarColor: colorFromName(key),
        status: "Available",
        joinDate: serverTimestamp()
      }
    });
    showNotification(`'${key}' added as ${role}.`, 'success');
    elements.newUsername.value = '';
    elements.newPass.value = '';
  } catch (error) {
    showNotification('Could not add that person. Try again.', 'error');
  }
}

function initials(name) {
  return (name || '?')[0].toUpperCase();
}

function updateUsersUI() {
  if (!elements.usersList) return;

  const entries = Object.entries(state.userMap);
  elements.onlineCount.textContent = entries.filter(([, i]) => i.status?.online).length;

  elements.usersList.innerHTML = "";

  if (entries.length === 0) {
    elements.usersList.innerHTML = `<div class="empty-hint">No one here yet.</div>`;
    return;
  }

  // Online users first, then alphabetical
  entries.sort((a, b) => {
    const aOn = a[1].status?.online ? 1 : 0;
    const bOn = b[1].status?.online ? 1 : 0;
    if (aOn !== bOn) return bOn - aOn;
    return a[0].localeCompare(b[0]);
  });

  for (const [username, info] of entries) {
    const row = document.createElement("div");
    row.className = "user-item";
    row.dataset.username = username;
    row.tabIndex = 0;

    row.onclick = () => {
      selectUser(username);
      if (window.innerWidth <= 768) {
        document.body.classList.add('show-chat-panel');
      }
    };

    const avatar = document.createElement("div");
    avatar.className = "user-avatar";
    avatar.style.background = info.profile?.avatarColor || colorFromName(username);
    applyAvatarElement(avatar, username, info.profile?.avatarUrl || getProfilePhoto(username));

    const indicator = document.createElement("div");
    indicator.className = `status-indicator ${info.status?.online ? 'online' : 'offline'}`;
    avatar.appendChild(indicator);

    const userInfo = document.createElement("div");
    userInfo.className = "user-info";

    const nameRow = document.createElement("div");
    nameRow.className = "user-name-row";
    const userName = document.createElement("span");
    userName.className = "user-name";
    userName.textContent = username;
    nameRow.appendChild(userName);
    if (info.role === 'admin') {
      const badge = document.createElement("span");
      badge.className = "role-badge";
      badge.textContent = "admin";
      nameRow.appendChild(badge);
    }

    const userStatus = document.createElement("div");
    userStatus.className = "user-status";
    userStatus.textContent = info.status?.online ? "online" : lastSeenText(info.status?.lastSeen);

    userInfo.append(nameRow, userStatus);
    row.append(avatar, userInfo);

    if (state.currentUser && username === state.currentUser.name) {
      row.classList.add('is-you');
    }

    elements.usersList.appendChild(row);
  }
}

function selectUser(username) {
  document.querySelectorAll('.user-item.selected').forEach(item => item.classList.remove('selected'));
  const userItem = document.querySelector(`[data-username="${username}"]`);
  if (userItem) userItem.classList.add('selected');
}

// Message handling
async function sendTextMessage(text) {
  if (!state.currentUser || !text.trim()) return;

  const messageData = {
    type: "text",
    name: state.currentUser.name,
    text: text.trim(),
    ts: Date.now(),
    deliveredBy: { [state.currentUser.name]: true },
    seenBy: { [state.currentUser.name]: true },
    id: generateId()
  };

  if (state.replyingTo) {
    messageData.replyTo = {
      id: state.replyingTo.id,
      text: state.replyingTo.text,
      name: state.replyingTo.name
    };
  }

  state.messages[messageData.id] = messageData;
  state.messageOrder.push(messageData.id);

  renderMessage(messageData.id, messageData);

  elements.textInput.value = '';
  elements.textInput.style.height = 'auto';
  updateComposerState();
  clearReply();
}

async function uploadAndSendFile(file) {
  if (!state.currentUser || !file) return;

  const isImg = file.type.startsWith("image/");
  const isVid = file.type.startsWith("video/");

  if (!isImg && !isVid) {
    showNotification("Só imagens ou vídeos podem ser enviados.", 'error');
    return;
  }

  if (file.size > 8 * 1024 * 1024) {
    showNotification("Mantenha os arquivos abaixo de 8MB.", 'warning');
    return;
  }

  showLoadingState(true);

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const messageData = {
        type: isVid ? "video" : "image",
        name: state.currentUser.name,
        data: e.target.result,
        filename: file.name,
        fileSize: file.size,
        ts: Date.now(),
        deliveredBy: { [state.currentUser.name]: true },
        seenBy: { [state.currentUser.name]: true },
        id: generateId()
      };

      state.messages[messageData.id] = messageData;
      state.messageOrder.push(messageData.id);

      renderMessage(messageData.id, messageData);
    } catch (error) {
      showNotification('Não foi possível enviar o arquivo.', 'error');
    } finally {
      showLoadingState(false);
    }
  };

  reader.onerror = () => {
    showLoadingState(false);
    showNotification('Não foi possível ler o arquivo.', 'error');
  };

  reader.readAsDataURL(file);
}

function showLoadingState(show) {
  const button = elements.sendBtn;

  if (show) {
    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    button.disabled = true;
  } else {
    button.innerHTML = '<i class="fas fa-paper-plane"></i>';
    button.disabled = false;
  }
}

function updateComposerState() {
  const hasText = elements.textInput.value.trim().length > 0;
  elements.sendBtn.classList.toggle('ready', hasText);
}

// Message reactions
async function toggleReaction(messageKey, emoji) {
  if (!state.currentUser) return;

  if (!state.reactions[messageKey]) state.reactions[messageKey] = {};
  if (!state.reactions[messageKey][emoji]) state.reactions[messageKey][emoji] = {};

  const users = state.reactions[messageKey][emoji];
  if (users[state.currentUser.name]) {
    delete users[state.currentUser.name];
  } else {
    users[state.currentUser.name] = { timestamp: Date.now(), user: state.currentUser.name };
  }

  if (Object.keys(users).length === 0) {
    delete state.reactions[messageKey][emoji];
  }
  if (Object.keys(state.reactions[messageKey]).length === 0) {
    delete state.reactions[messageKey];
  }

  const messageEl = document.querySelector(`[data-message-id="${messageKey}"] .message-col`);
  if (messageEl) renderReactionsInto(messageKey, messageEl);
}

function clearReply() {

function updateReplyUI() {

  if (state.replyingTo) {

function isNearBottom() {
  const el = elements.messages;
  return el.scrollHeight - el.scrollTop - el.clientHeight < 120;
}

function scrollToBottom(smooth = true) {
  elements.messages.scrollTo({ top: elements.messages.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  elements.scrollBottomBtn.classList.remove('show');
  state.unseenWhileScrolled = 0;
  updateScrollBadge();
}

function updateScrollBadge() {
  const badge = elements.scrollBottomBtn.querySelector('.scroll-badge');
  if (state.unseenWhileScrolled > 0) {
    badge.textContent = state.unseenWhileScrolled > 9 ? '9+' : state.unseenWhileScrolled;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

// Message rendering
function renderMessage(key, msg) {
  const isMe = msg.name === state.currentUser?.name;
  const ts = typeof msg.ts === 'number' ? msg.ts : Date.now();
  const wasAtBottom = isNearBottom();

  // Date divider
  const lastTs = state.lastRenderedMeta.ts;
  if (!lastTs || fmtDateDivider(ts) !== fmtDateDivider(lastTs)) {
    const divider = document.createElement('div');
    divider.className = 'date-divider';
    divider.innerHTML = `<span>${fmtDateDivider(ts)}</span>`;
    elements.messages.appendChild(divider);
  }

  // Grouping: same sender, within 3 minutes, no reply chain break
  const grouped = state.lastRenderedMeta.name === msg.name
    && (ts - state.lastRenderedMeta.ts) < 180000
    && !msg.replyTo;

  const wrapper = document.createElement("div");
  wrapper.className = `message-wrapper ${isMe ? "me" : "other"} ${grouped ? "grouped" : ""}`;
  wrapper.dataset.messageId = key;
  wrapper.dataset.searchable = (msg.text || '').toLowerCase();
  wrapper.dataset.author = msg.name;

  {
    const avatar = document.createElement("div");
    avatar.className = "msg-avatar";
    applyMessageAvatar(avatar, msg.name, state.userMap[msg.name]?.profile?.avatarUrl || getProfilePhoto(msg.name));
    wrapper.appendChild(avatar);
  }

  const col = document.createElement("div");
  col.className = "message-col";

  if (msg.replyTo) {
    const replyIndicator = document.createElement("div");
    replyIndicator.className = "reply-indicator";
    replyIndicator.innerHTML = `
      <div class="reply-line"></div>
      <div class="reply-info">
        <span class="reply-author">${escapeHtml(msg.replyTo.name)}</span>
        <span class="reply-snippet">${escapeHtml(msg.replyTo.text || 'Media message')}</span>
      </div>
    `;
    col.appendChild(replyIndicator);
  }

  const bubble = document.createElement("div");
  bubble.className = "message-bubble";

  if (!isMe && !grouped) {
    const authorName = document.createElement("div");
    authorName.className = "message-author";
    authorName.textContent = msg.name;
    authorName.style.color = colorFromName(msg.name);
    bubble.appendChild(authorName);
  }

  if (msg.type === "image") {
    const img = document.createElement("img");
    img.src = msg.data;
    img.className = "chat-media";
    img.alt = msg.filename || "Image";
    img.loading = "lazy";
    img.onclick = () => openMediaModal(img.src, 'image');
    bubble.appendChild(img);
  } else if (msg.type === "video") {
    const video = document.createElement("video");
    video.src = msg.data;
    video.controls = true;
    video.className = "chat-media";
    bubble.appendChild(video);
  } else if (msg.type === "gif") {
    const gifImg = document.createElement("img");
    gifImg.src = msg.gifUrl || msg.data;
    gifImg.className = "chat-media chat-gif";
    gifImg.alt = msg.title || "GIF";
    gifImg.loading = "lazy";
    gifImg.onerror = () => { gifImg.alt = "GIF indisponível"; };
    bubble.appendChild(gifImg);
  } else {
    const textContent = document.createElement("div");
    textContent.className = "message-text";
    textContent.innerHTML = state.searchQuery ? highlightMatch(msg.text || '', state.searchQuery) : formatText(msg.text || "");
    bubble.appendChild(textContent);
  }

  const footer = document.createElement("div");
  footer.className = "message-footer";
  const timestamp = document.createElement("span");
  timestamp.className = "message-time";
  timestamp.textContent = fmtTime(ts);
  footer.appendChild(timestamp);

  if (isMe) {
    const deliveredCount = Object.keys(msg.deliveredBy || {}).length;
    const seenCount = Object.keys(msg.seenBy || {}).filter(u => u !== msg.name).length;
    const status = document.createElement("span");
    status.className = "message-status";
    if (seenCount > 0) status.innerHTML = '<i class="fas fa-check-double seen"></i>';
    else if (deliveredCount > 0) status.innerHTML = '<i class="fas fa-check-double"></i>';
    else status.innerHTML = '<i class="fas fa-check"></i>';
    footer.appendChild(status);
  }

  bubble.appendChild(footer);

  const actions = document.createElement("div");
  actions.className = "message-actions";

  const reactButton = document.createElement("button");
  reactButton.className = "action-button";
    reactButton.innerHTML = '<i class="far fa-face-smile"></i>';
  reactButton.onclick = (e) => { e.stopPropagation(); showEmojiPicker(key, reactButton); };
  actions.appendChild(reactButton);

  const replyButton = document.createElement("button");
  replyButton.className = "action-button";
    replyButton.innerHTML = '<i class="fas fa-reply"></i>';
  replyButton.onclick = (e) => {
    e.stopPropagation();
    setReply({ id: key, text: msg.text, name: msg.name });
  };
  actions.appendChild(replyButton);

  if (msg.text) {
    const copyButton = document.createElement("button");
    copyButton.className = "action-button";
        copyButton.innerHTML = '<i class="far fa-copy"></i>';
    copyButton.onclick = (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(msg.text).then(() => showNotification('Copied to clipboard.', 'success'));
    };
    actions.appendChild(copyButton);
  }

  const deleteButton = document.createElement("button");
  deleteButton.className = "action-button delete-action";
  deleteButton.setAttribute("aria-label", "Apagar mensagem");
  deleteButton.removeAttribute("title");
  deleteButton.removeAttribute("data-tooltip");
  deleteButton.innerHTML = '<i class="far fa-trash-can"></i>';
  deleteButton.onclick = (e) => {
    e.stopPropagation();
    openDeleteMenu(key, msg);
  };
  actions.appendChild(deleteButton);

  bubble.appendChild(actions);
  col.appendChild(bubble);

  if (state.reactions[key]) {
    renderReactionsInto(key, col);
  }

  wrapper.appendChild(col);
  elements.messages.appendChild(wrapper);

  state.lastRenderedMeta = { name: msg.name, ts };

  if (wasAtBottom || isMe) {
    scrollToBottom(isMe ? false : true);
  } else {
    state.unseenWhileScrolled++;
    elements.scrollBottomBtn.classList.add('show');
    updateScrollBadge();
  }

  if (!isMe) {
    markDelivered(key);
    markSeen(key);
    if (state.currentUser) playNotificationSound();
  }

  requestAnimationFrame(() => wrapper.classList.add('message-entered'));
}


// Delete message functionality
function closeDeleteMenu() {
  const overlay = document.getElementById('deleteOverlay');
  if (overlay) overlay.remove();
}

function openDeleteMenu(key, msg) {
  closeDeleteMenu();

  const isMe = msg.name === state.currentUser?.name;

  const overlay = document.createElement('div');
  overlay.id = 'deleteOverlay';
  overlay.className = 'delete-overlay';

  const menu = document.createElement('div');
  menu.className = 'delete-menu';
  menu.setAttribute('role', 'dialog');
  menu.setAttribute('aria-modal', 'true');

  const title = document.createElement('div');
  title.className = 'delete-menu-title';
  title.textContent = 'Apagar mensagem';
  menu.appendChild(title);

  const subtitle = document.createElement('div');
  subtitle.className = 'delete-menu-subtitle';
  subtitle.textContent = isMe ? 'Escolha onde remover esta mensagem.' : 'Esta mensagem será removida só para você.';
  menu.appendChild(subtitle);

  const deleteForMe = document.createElement('button');
  deleteForMe.className = 'delete-menu-option';
  deleteForMe.innerHTML = '<i class="far fa-trash-can"></i><span>Apagar para mim</span>';
  deleteForMe.onclick = () => {
    deleteForMeOnly(key);
    closeDeleteMenu();
  };
  menu.appendChild(deleteForMe);

  if (isMe) {
    const deleteForEveryone = document.createElement('button');
    deleteForEveryone.className = 'delete-menu-option danger';
    deleteForEveryone.innerHTML = '<i class="fas fa-trash-can"></i><span>Apagar para todos</span>';
    deleteForEveryone.onclick = () => {
      if (confirm('Apagar esta mensagem para todos?')) deleteForEveryoneLocal(key);
      closeDeleteMenu();
    };
    menu.appendChild(deleteForEveryone);
  }

  const cancel = document.createElement('button');
  cancel.className = 'delete-menu-cancel';
  cancel.textContent = 'Cancelar';
  cancel.onclick = closeDeleteMenu;
  menu.appendChild(cancel);

  overlay.appendChild(menu);
  document.body.appendChild(overlay);

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeDeleteMenu();
  });

  menu.querySelector('button')?.focus();
}

function deleteForMeOnly(key) {
  const messageEl = document.querySelector(`[data-message-id="${key}"]`);
  if (messageEl) messageEl.remove();

  delete state.messages[key];
  state.messageOrder = state.messageOrder.filter(id => id !== key);
  delete state.reactions[key];

  showNotification('Mensagem apagada para você.', 'success');
}

function deleteForEveryoneLocal(key) {
  const message = state.messages[key];
  if (!message) return;

  message.type = 'deleted';
  message.text = '';
  message.data = null;
  message.filename = null;
  message.deleted = true;
  message.deletedAt = Date.now();

  const messageEl = document.querySelector(`[data-message-id="${key}"]`);
  if (!messageEl) return;

  const bubble = messageEl.querySelector('.message-bubble');
  if (!bubble) return;

  bubble.querySelectorAll('.message-author, .message-text, .chat-media, .message-footer, .message-actions').forEach(el => el.remove());

  const deletedContent = document.createElement('div');
  deletedContent.className = 'deleted-message';
  deletedContent.innerHTML = '<i class="fas fa-ban"></i><span>Mensagem apagada</span>';
  bubble.appendChild(deletedContent);

  showNotification('Mensagem apagada para todos.', 'success');
}

function renderReactionsInto(key, col) {
  const existing = col.querySelector('.message-reactions');
  if (existing) existing.remove();

  const reactionsContainer = document.createElement("div");
  reactionsContainer.className = "message-reactions";

  const reactionGroups = {};
  Object.entries(state.reactions[key] || {}).forEach(([emoji, users]) => {
    if (Object.keys(users).length > 0) reactionGroups[emoji] = Object.keys(users);
  });

  Object.entries(reactionGroups).forEach(([emoji, users]) => {
    const reactionBadge = document.createElement("button");
    reactionBadge.className = `reaction-badge ${users.includes(state.currentUser?.name) ? 'active' : ''}`;
    reactionBadge.innerHTML = `<span>${emoji}</span><span class="reaction-count">${users.length}</span>`;
    reactionBadge.title = users.join(', ');
    reactionBadge.onclick = () => toggleReaction(key, emoji);
    reactionsContainer.appendChild(reactionBadge);
  });

  if (Object.keys(reactionGroups).length > 0) col.appendChild(reactionsContainer);
}

// GIPHY picker
let gifSearchTimer = null;

function closeGifPicker() {
  const picker = document.getElementById('gifPicker');
  if (!picker) return;
  picker.classList.remove('show');
  picker.setAttribute('aria-hidden', 'true');
}

function openGifPicker() {
  const picker = document.getElementById('gifPicker');
  if (!picker) return;
  const emojiPicker = document.getElementById('emojiPicker');
  if (emojiPicker) emojiPicker.classList.remove('show');
  picker.classList.toggle('show');
  picker.setAttribute('aria-hidden', picker.classList.contains('show') ? 'false' : 'true');
  if (picker.classList.contains('show')) {
    setTimeout(() => document.getElementById('gifSearchInput')?.focus(), 30);
  }
}

function showGifPlaceholder(message = 'Pesquise um GIF') {
  const results = document.getElementById('gifResults');
  if (!results) return;
  results.innerHTML = `<div class="gif-empty"><i class="fas fa-film"></i><span>${escapeHtml(message)}</span></div>`;
}

function renderGifResults(items) {
  const results = document.getElementById('gifResults');
  if (!results) return;
  results.innerHTML = '';

  if (!items.length) {
    showGifPlaceholder('Nenhum GIF encontrado');
    return;
  }

  items.forEach(gif => {
    const original = gif.images?.original;
    const preview = gif.images?.fixed_width_small || gif.images?.preview_gif || gif.images?.original;
    if (!original?.url || !preview?.url) return;

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'gif-result';
    button.title = gif.title || 'Enviar GIF';

    const img = document.createElement('img');
    img.src = preview.url;
    img.alt = gif.title || 'GIF';
    img.loading = 'lazy';
    button.appendChild(img);

    button.addEventListener('click', () => sendGifMessage({
      url: original.url,
      width: original.width,
      height: original.height,
      title: gif.title || 'GIF'
    }));

    results.appendChild(button);
  });
}

async async function searchGiphyLocal(query) {
  const results = document.getElementById('gifResults');
  if (!results) return;
  const q = query.trim();
  if (!q) { showGifPlaceholder(); return; }

  if (!GIPHY_API_KEY || GIPHY_API_KEY === 'COLE_SUA_CHAVE_GIPHY_AQUI') {
    showGifPlaceholder('Cole sua API Key do GIPHY no código primeiro');
    return;
  }

  results.innerHTML = '<div class="gif-empty"><i class="fas fa-spinner fa-spin"></i><span>Pesquisando…</span></div>';

  try {
    const params = new URLSearchParams({
      api_key: GIPHY_API_KEY,
      q,
      limit: '24',
      rating: 'pg-13',
      lang: 'pt'
    });

    const response = await fetch(`${GIPHY_SEARCH_URL}?${params.toString()}`);
    if (!response.ok) throw new Error(`GIPHY HTTP ${response.status}`);

    const payload = await response.json();
    renderGifResults(Array.isArray(payload.data) ? payload.data : []);
  } catch (error) {
    console.error('GIPHY search error:', error);
    showGifPlaceholder('Não foi possível carregar os GIFs');
  }
}

function sendGifMessage(gif) {
  if (!state.currentUser || !gif?.url) return;

  const messageData = {
    type: 'gif',
    name: state.currentUser.name,
    data: gif.url,
    gifUrl: gif.url,
    width: Number(gif.width) || 0,
    height: Number(gif.height) || 0,
    title: gif.title || 'GIF',
    ts: Date.now(),
    deliveredBy: { [state.currentUser.name]: true },
    seenBy: { [state.currentUser.name]: true },
    id: generateId()
  };

  state.messages[messageData.id] = messageData;
  state.messageOrder.push(messageData.id);
  renderMessage(messageData.id, messageData);
  closeGifPicker();
}

function bindGifPicker() {
  elements.gifBtn?.addEventListener('click', (e) => {
    e.stopPropagation();
    openGifPicker();
  });

  document.getElementById('gifCloseBtn')?.addEventListener('click', closeGifPicker);

  const input = document.getElementById('gifSearchInput');
  input?.addEventListener('input', (e) => {
    clearTimeout(gifSearchTimer);
    gifSearchTimer = setTimeout(() => searchGiphyLocal(e.target.value), 300);
  });

  document.addEventListener('click', (e) => {
    const picker = document.getElementById('gifPicker');
    if (picker?.classList.contains('show') && !picker.contains(e.target) && e.target !== elements.gifBtn) {
      closeGifPicker();
    }
  });
}

// Emoji picker
function buildEmojiPicker() {
  const picker = document.getElementById('emojiPicker');
  picker.innerHTML = EMOJI_SET.map(e => `<button class="emoji-option">${e}</button>`).join('');
  picker.querySelectorAll('.emoji-option').forEach(button => {
    button.addEventListener('click', (e) => {
      const emoji = e.target.textContent;
      const messageKey = picker.dataset.messageKey;
      toggleReaction(messageKey, emoji);
      closeEmojiPicker();
    });
  });
}

function showEmojiPicker(messageKey, button) {
  const picker = document.getElementById('emojiPicker');
  if (!picker) return;

  picker.dataset.messageKey = messageKey;
  picker.classList.add('show');

  const rect = button.getBoundingClientRect();
  const pickerWidth = Math.min(300, window.innerWidth - 20);
  const pickerHeight = picker.offsetHeight || 56;

  let left = rect.left + (rect.width / 2) - (pickerWidth / 2);
  left = Math.max(10, Math.min(left, window.innerWidth - pickerWidth - 10));

  let top = rect.top - pickerHeight - 8;
  if (top < 10) top = rect.bottom + 8;
  if (top + pickerHeight > window.innerHeight - 10) {
    top = Math.max(10, window.innerHeight - pickerHeight - 10);
  }

  picker.style.width = `${pickerWidth}px`;
  picker.style.left = `${left}px`;
  picker.style.top = `${top}px`;

  setTimeout(() => document.addEventListener('click', closeEmojiPicker, { once: true }), 50);
}

function closeEmojiPicker() {
  const picker = document.getElementById('emojiPicker');
  if (picker) picker.classList.remove('show');
}

// Search functionality
function performSearch(query) {
  state.searchQuery = query.toLowerCase();
  const messages = document.querySelectorAll('.message-wrapper');
  let visible = 0;

  messages.forEach(msg => {
    const searchableText = msg.dataset.searchable || '';
    const matches = !query || searchableText.includes(state.searchQuery);
    msg.classList.toggle('search-hidden', !matches);
    const textEl = msg.querySelector('.message-text');
    if (textEl && msg.dataset.searchable) {
      textEl.innerHTML = query ? highlightMatch(msg.dataset.searchable, state.searchQuery) : formatText(textEl.textContent);
    }
    if (matches) visible++;
  });

  elements.searchResultCount.textContent = query ? `${visible} result${visible === 1 ? '' : 's'}` : '';
  elements.searchResultCount.classList.toggle('show', !!query);
}

function clearSearch() {
  state.searchQuery = '';
  elements.searchInput.value = '';
  document.querySelectorAll('.message-wrapper').forEach(msg => msg.classList.remove('search-hidden'));
  elements.searchResultCount.classList.remove('show');
}

// Notification system
function showNotification(message, type = 'info') {
  const notification = document.createElement('div');
  notification.className = `notification ${type}`;
  const icons = { success: 'fa-circle-check', error: 'fa-circle-exclamation', warning: 'fa-triangle-exclamation', info: 'fa-circle-info' };
  notification.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(message)}</span>`;

  document.body.appendChild(notification);
  setTimeout(() => notification.classList.add('show'), 20);
  setTimeout(() => {
    notification.classList.remove('show');
    setTimeout(() => notification.remove(), 300);
  }, 3200);
}

// Export functionality
async function exportChat() {
  try {
    const messages = state.messageOrder
      .map(key => state.messages[key])
      .filter(Boolean);

    const exportData = {
      exportDate: new Date().toISOString(),
      chatRoom: 'ACCEA',
      messages: messages.map(msg => ({
        ...msg,
        timestamp: new Date(msg.ts).toISOString()
      }))
    };

    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `accea-export-${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showNotification('Conversa exportada.', 'success');
  } catch (error) {
    showNotification('Não foi possível exportar a conversa.', 'error');
  }
}

// Clear chat functionality
async function clearChat() {
  if (!confirm("Apagar todas as mensagens desta conversa?")) return;

  state.messages = {};
  state.messageOrder = [];
  state.reactions = {};
  state.lastRenderedMeta = { name: null, ts: 0 };
  elements.messages.innerHTML = '';
  showNotification('Conversa limpa.', 'success');
}

// Event listeners setup
function bindEvents() {
  elements.themeToggle?.addEventListener('click', () => {
    setTheme(state.theme === 'dark' ? 'light' : 'dark');
  });

  elements.soundToggle?.addEventListener('click', () => {
    state.soundEnabled = !state.soundEnabled;
    sessionStorage.setItem('kikochat-sound', state.soundEnabled);
    elements.soundToggle.innerHTML = state.soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
    showNotification(`Sound ${state.soundEnabled ? 'on' : 'off'}.`, 'info');
  });

  elements.loginButton?.addEventListener('click', () => login(elements.usernameLogin.value, elements.passLogin.value));

  [elements.usernameLogin, elements.passLogin].forEach(input => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); login(elements.usernameLogin.value, elements.passLogin.value); }
    });
  });

  elements.logoutBtn?.addEventListener('click', logout);

  elements.meAvatarWrap?.addEventListener('click', () => {
    elements.profilePhotoInput?.click();
  });

  elements.profilePhotoInput?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (file) handleProfilePhoto(file);
    e.target.value = '';
  });

  elements.textInput?.addEventListener('input', (e) => {
    e.target.style.height = 'auto';
    e.target.style.height = `${Math.min(e.target.scrollHeight, 140)}px`;
    updateComposerState();
    // Indicador de digitação será conectado ao Firebase depois.
  });

  elements.textInput?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendTextMessage(e.target.value);
    } else if (e.key === 'Escape') {
      clearReply();
    }
  });

  elements.sendBtn?.addEventListener('click', () => sendTextMessage(elements.textInput.value));

  elements.attachBtn?.addEventListener('click', () => elements.fileInput.click());

  elements.fileInput?.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) { uploadAndSendFile(file); e.target.value = ''; }
  });

  ['dragover', 'dragleave', 'drop'].forEach(evt => {
    elements.composer?.addEventListener(evt, (e) => {
      e.preventDefault();
      elements.composer.classList.toggle('drag-over', evt === 'dragover');
      if (evt === 'drop') {
        elements.composer.classList.remove('drag-over');
        Array.from(e.dataTransfer.files).forEach(file => {
          if (file.type.startsWith('image/') || file.type.startsWith('video/')) uploadAndSendFile(file);
        });
      }
    });
  });

  elements.addUserBtn?.addEventListener('click', () => createUser(elements.newUsername.value, elements.newPass.value));
  elements.addAdminBtn?.addEventListener('click', () => createUser(elements.newUsername.value, elements.newPass.value, 'admin'));
  elements.clearChatBtn?.addEventListener('click', clearChat);

  elements.searchInput?.addEventListener('input', (e) => performSearch(e.target.value));
  elements.searchInput?.addEventListener('keydown', (e) => { if (e.key === 'Escape') clearSearch(); });
  elements.searchClearBtn?.addEventListener('click', clearSearch);

  // Ações das mensagens: escondidas por padrão.
  // Hover mostra no computador; clique/toque fixa temporariamente.
  elements.messages?.addEventListener('click', (e) => {
    const actionButton = e.target.closest('.message-actions .action-button');
    if (actionButton) return;

    const bubble = e.target.closest('.message-bubble');
    if (!bubble || !elements.messages.contains(bubble)) return;

    document.querySelectorAll('.message-bubble.actions-open').forEach(other => {
      if (other !== bubble) other.classList.remove('actions-open');
    });
    bubble.classList.toggle('actions-open');
  });

  document.addEventListener('click', (e) => {
    if (e.target.closest('.message-bubble')) return;
    document.querySelectorAll('.message-bubble.actions-open').forEach(b => b.classList.remove('actions-open'));
  });

  elements.clearReplyBtn?.addEventListener('click', clearReply);

  elements.backToUsersBtn?.addEventListener('click', () => document.body.classList.remove('show-chat-panel'));

  elements.exportBtn?.addEventListener('click', exportChat);

  elements.scrollBottomBtn?.addEventListener('click', () => scrollToBottom(true));

  elements.messages?.addEventListener('scroll', () => {
    if (isNearBottom()) {
      elements.scrollBottomBtn.classList.remove('show');
      state.unseenWhileScrolled = 0;
      updateScrollBadge();
    }
  });

  document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });
  });

  document.querySelectorAll('.modal-close').forEach(button => {
    button.addEventListener('click', (e) => e.target.closest('.modal').classList.remove('show'));
  });
}

// Firebase listeners (reservados para a etapa do Firebase)
function attachFirebaseListeners() {
  onChildAdded(roomRef, (snapshot) => renderMessage(snapshot.key, snapshot.val()));

  onValue(usersRef, (snapshot) => {
    state.userMap = snapshot.exists() ? snapshot.val() : {};
    updateUsersUI();
  });

  onValue(dbRef(db, TYPING_PATH), (snapshot) => {
    state.typing = snapshot.val() || {};
    updateTypingIndicator();
  });

  onValue(dbRef(db, REACTIONS_PATH), (snapshot) => {
    state.reactions = snapshot.val() || {};
    Object.keys(state.reactions).forEach(messageKey => {
      const messageEl = document.querySelector(`[data-message-id="${messageKey}"] .message-col`);
      if (messageEl) renderReactionsInto(messageKey, messageEl);
    });
  });

  watchConnection();
}

// Login system
async function login(username, password) {
  const name = String(username || '').trim();

  if (!name || !password) {
    showNotification("Digite seu nome e sua senha.", 'error');
    return;
  }

  const user = {
    name,
    role: "user"
  };

  state.currentUser = user;
  state.userMap[name] = {
    role: "user",
    profile: {
      avatarColor: colorFromName(name),
      avatarUrl: getProfilePhoto(name),
      status: "Disponível"
    },
    status: {
      online: true,
      lastSeen: Date.now()
    }
  };

  sessionStorage.setItem("kikochat_user", JSON.stringify(user));

  initChatUI(user);
}
  
function logout() {
  sessionStorage.clear();
  location.reload();
}

// Chat UI initialization
async function initChatUI(user) {
  state.currentUser = user;

  if (!state.userMap[user.name]) {
    state.userMap[user.name] = {
      role: user.role || "user",
      profile: {
        avatarColor: colorFromName(user.name),
        avatarUrl: getProfilePhoto(user.name),
        status: "Disponível"
      },
      status: {
        online: true,
        lastSeen: Date.now()
      }
    };
  } else {
    state.userMap[user.name].profile = {
      ...(state.userMap[user.name].profile || {}),
      avatarUrl: getProfilePhoto(user.name)
    };
    state.userMap[user.name].status = {
      ...(state.userMap[user.name].status || {}),
      online: true,
      lastSeen: Date.now()
    };
  }

  elements.loginView.style.display = "none";
  elements.mainView.style.display = "grid";
  elements.meName.textContent = user.name;
  elements.meRole.textContent = user.role === "admin" ? "Admin" : "Membro";
  applyAvatarElement(elements.meAvatar, user.name, getProfilePhoto(user.name));

  if (user.role === "admin") elements.adminPanel.style.display = "flex";

  updateUsersUI();
  buildEmojiPicker();
  bindGifPicker();

  setTimeout(() => elements.textInput?.focus(), 150);
}

.reply-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.reply-author { font-weight: 600; color: var(--accent-soft); }
.reply-snippet { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.message-bubble {
  padding: 10px 14px; border-radius: var(--radius);
  position: relative; word-wrap: break-word;
  box-shadow: var(--shadow-sm); transition: var(--transition); max-width: 100%;
}
.message-wrapper.me .message-bubble { background: var(--my-bubble); color: #251705; border-bottom-right-radius: 5px; }
.message-wrapper.other .message-bubble { background: var(--other-bubble); color: var(--text-primary); border-bottom-left-radius: 5px; border: 1px solid var(--border-soft); }
.message-bubble:hover { box-shadow: var(--shadow-md); }
.message-bubble:hover .message-actions { opacity: 1; pointer-events: auto; transform: translateY(0); }

.message-author { font-size: 12.5px; font-weight: 700; margin-bottom: 3px; }

.message-text { font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; }
.message-text strong { font-weight: 700; }
.message-text em { font-style: italic; }
.message-text code { background: rgba(0,0,0,0.15); padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 12.5px; }
.message-wrapper.me .message-text code { background: rgba(0,0,0,0.12); }

.mention { background: var(--accent-glow); color: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-weight: 600; }
.message-wrapper.me .mention { background: rgba(0,0,0,0.14); color: #251705; }

.chat-media { max-width: 280px; max-height: 220px; border-radius: 10px; cursor: pointer; transition: var(--transition); display: block; }
.chat-media:hover { filter: brightness(1.04); transform: scale(1.01); }

.message-footer { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 4px; font-size: 10.5px; font-family: var(--font-mono); opacity: 0.65; }
.message-status i { font-size: 12px; }
.message-status .seen { color: #2d5c3f; }
.message-wrapper.other .message-status .seen { color: var(--accent-soft); }

.message-actions {
  position: absolute; top: -18px; right: 6px; display: flex; gap: 2px;
  opacity: 0; pointer-events: none; transform: translateY(4px);
  transition: var(--transition); background: var(--bg-elevated);
  border: 1px solid var(--border-soft); border-radius: 20px; padding: 3px;
  box-shadow: var(--shadow-md);
}
.message-wrapper.me .message-actions { right: auto; left: 6px; }

.action-button {
  width: 26px; height: 26px; border: none; background: transparent;
  color: var(--text-secondary); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: var(--transition); font-size: 12px;
}
.action-button:hover { background: var(--bg-tertiary); color: var(--accent-soft); }
.action-button[aria-label] { -webkit-user-select: none; user-select: none; }

.message-reactions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
#emojiPicker {
  position: fixed;
  z-index: 1000000;
  display: none;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  width: min(300px, calc(100vw - 20px));
  padding: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  box-shadow: 0 14px 40px rgba(0,0,0,.35);
}

#emojiPicker.show {
  display: flex;
}

.emoji-option {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 9px;
  background: transparent;
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.emoji-option:hover {
  background: var(--bg-tertiary);
  transform: scale(1.08);
}

.reaction-badge {
  display: flex; align-items: center; gap: 4px; padding: 3px 8px;
  background: var(--bg-elevated); border: 1px solid var(--border-soft);
  border-radius: 14px; font-size: 12px; cursor: pointer; transition: var(--transition); color: var(--text-secondary);
}
.reaction-badge:hover { border-color: var(--accent); }
.reaction-badge.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent-soft); }
.reaction-count { font-family: var(--font-mono); font-size: 11px; }

/* Scroll to bottom */
.scroll-bottom-btn {
  position: absolute; bottom: 16px; right: 22px;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-elevated); border: 1px solid var(--border-soft);
  color: var(--text-primary); box-shadow: var(--shadow-md);
  display: flex; align-items: center; justify-content: center;

  transition: var(--transition); z-index: 5;
}
.scroll-bottom-btn.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.scroll-bottom-btn:hover { border-color: var(--accent); color: var(--accent-soft); }
.scroll-badge {
  position: absolute; top: -4px; right: -4px; min-width: 17px; height: 17px;
  background: var(--error); color: #fff; border-radius: 10px; font-size: 10px;
  font-weight: 700; align-items: center; justify-content: center; padding: 0 4px; display: none;
}

/* Composer */
.composer-container { padding: 12px 22px 18px; border-top: 1px solid var(--border-soft); background: var(--bg-secondary); }

#replyContainer {
  display: none; align-items: center; gap: 10px; padding: 9px 14px;
  background: var(--bg-tertiary); border: 1px solid var(--border-soft);
  border-bottom: none; border-radius: var(--radius) var(--radius) 0 0;
}
#replyContainer.show { display: flex; }

.reply-indicator-icon { color: var(--accent-soft); font-size: 13px; }
.reply-content { flex: 1; min-width: 0; }
.reply-content .reply-author { font-size: 12px; font-weight: 600; color: var(--accent-soft); margin-bottom: 1px; }
.reply-content .reply-text { font-size: 12.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#clearReplyBtn {
  width: 22px; height: 22px; border: none; background: transparent; color: var(--text-tertiary);
  border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px;
}
#clearReplyBtn:hover { background: var(--bg-elevated); color: var(--text-primary); }

.composer {
  display: flex; gap: 8px; align-items: flex-end; padding: 8px 8px 8px 12px;
  background: var(--bg-tertiary); border: 1.5px solid var(--border-soft);

}
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
.composer.drag-over { border-color: var(--accent); background: var(--bg-elevated); }
#replyContainer.show ~ .composer { border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

.composer-btn {
  width: 36px; height: 36px; border: none; background: transparent;
  color: var(--text-tertiary); border-radius: 50%;

}
.composer-btn:hover { background: var(--bg-elevated); color: var(--accent-soft); }

#textInput {
  flex: 1; min-height: 22px; max-height: 140px; padding: 8px 4px;
  border: none; background: transparent; color: var(--text-primary);
  font-family: var(--font-body); font-size: 14.5px; line-height: 1.5;
  resize: none; outline: none;
}
#textInput::placeholder { color: var(--text-tertiary); }

.gif-btn {
  width: 36px;
  height: 36px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--accent-soft);
  border: 1px solid var(--border-soft);
}
.gif-btn:hover {
  background: var(--accent-glow);
  color: var(--accent);
  border-color: var(--accent);
}

#sendBtn {
  width: 38px; height: 38px; border: none; background: var(--bg-elevated);
  color: var(--text-tertiary); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: var(--transition); font-size: 14px; flex-shrink: 0;
}
#sendBtn.ready { background: var(--my-bubble); color: #251705; box-shadow: 0 0 16px 2px var(--accent-glow); }
#sendBtn.ready:hover { transform: scale(1.06); }
#sendBtn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

.composer-hint { margin-top: 8px; font-size: 11px; color: var(--text-tertiary); text-align: center; }
.composer-hint kbd { font-family: var(--font-mono); background: var(--bg-tertiary); border: 1px solid var(--border-soft); border-radius: 4px; padding: 1px 5px; font-size: 10px; }


/* GIF picker */
.gif-picker {
  position: fixed;
  right: 22px;
  bottom: 88px;
  z-index: 100000;
  width: min(390px, calc(100vw - 28px));
  height: min(480px, calc(100vh - 130px));
  display: none;
  flex-direction: column;
  padding: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-soft);
  border-radius: 18px;
  box-shadow: 0 18px 55px rgba(0,0,0,.4);
}
.gif-picker.show { display: flex; }
.gif-results { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; overflow:auto; flex:1; min-height:0; padding-right:2px; }
.gif-result { border:0; padding:0; margin:0; background:var(--bg-tertiary); border-radius:8px; overflow:hidden; cursor:pointer; min-height:90px; }
.gif-result:hover { outline:2px solid var(--accent); transform:scale(1.01); }
.gif-result img { display:block; width:100%; height:100px; object-fit:cover; }
.chat-gif { max-width:280px; max-height:280px; object-fit:contain; background:var(--bg-tertiary); }
@media (max-width:480px) { .gif-results { grid-template-columns:repeat(2,minmax(0,1fr)); } .gif-result img { height:110px; } }

.gif-picker-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.gif-picker-title { display:flex; align-items:baseline; gap:7px; }
.gif-picker-title strong { font-size:15px; }
.gif-picker-title span { font-size:9px; font-weight:800; color:var(--accent-soft); letter-spacing:.08em; }
.gif-close { width:30px; height:30px; border:0; border-radius:50%; background:transparent; color:var(--text-tertiary); cursor:pointer; }
.gif-close:hover { background:var(--bg-tertiary); color:var(--text-primary); }
.gif-search-row { display:flex; align-items:center; gap:8px; padding:9px 11px; background:var(--bg-tertiary); border:1px solid var(--border-soft); border-radius:12px; }
.gif-search-row i { color:var(--text-tertiary); font-size:12px; }
#gifSearchInput { flex:1; border:0; outline:0; background:transparent; color:var(--text-primary); font:13px var(--font-body); }
#gifSearchInput::placeholder { color:var(--text-tertiary); }
.gif-results { flex:1; min-height:0; overflow:auto; margin-top:10px; display:grid; grid-template-columns:repeat(2,1fr); gap:7px; align-content:start; }
.gif-empty { grid-column:1/-1; min-height:180px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; color:var(--text-tertiary); font-size:12.5px; text-align:center; }
.gif-empty i { font-size:24px; color:var(--accent-soft); opacity:.8; }
.gif-branding { font-size:9px; color:var(--text-tertiary); text-align:right; padding-top:7px; opacity:.7; }
@media (max-width:768px) {
  .gif-picker { right:14px; bottom:76px; width:calc(100vw - 28px); height:min(440px,calc(100vh - 110px)); }
}

/* Delete menu */
.delete-action:hover {
  color: var(--error);
  background: rgba(248, 113, 113, 0.12);
}

.delete-overlay {
  position: fixed;
  inset: 0;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(0, 0, 0, 0.48);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}

.delete-menu {
  width: min(320px, calc(100vw - 36px));
  box-sizing: border-box;
  padding: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-soft);
  border-radius: 16px;
  box-shadow: 0 18px 55px rgba(0,0,0,.35);
  max-height: calc(100vh - 36px);
  overflow: auto;
}

.delete-menu-title {
  padding: 6px 10px 3px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
}

.delete-menu-subtitle {
  padding: 0 10px 10px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-tertiary);
}

.delete-menu-option,
.delete-menu-cancel {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  border: none;
  border-radius: 10px;
  padding: 12px;
  background: transparent;
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}

.delete-menu-option:hover,
.delete-menu-cancel:hover {
  background: var(--bg-tertiary);
}

.delete-menu-option:focus-visible,
.delete-menu-cancel:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.delete-menu-option i {
  width: 18px;
  text-align: center;
  color: var(--text-secondary);
}

.delete-menu-option.danger {
  color: var(--error);
}

.delete-menu-option.danger i {
  color: var(--error);
}

.delete-menu-cancel {
  margin-top: 5px;
  justify-content: center;
  color: var(--text-tertiary);
  border-top: 1px solid var(--border-soft);
  border-radius: 0 0 9px 9px;
}

/* Responsive */
@media (hover: none), (pointer: coarse) {
  .message-actions { opacity: 0; pointer-events: none; transform: translateY(4px); }
  .message-bubble.actions-open .message-actions {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
}

@media (max-width: 1200px) { #mainView { grid-template-columns: 284px 1fr; } }

@media (max-width: 768px) {
  #mainView { grid-template-columns: 1fr; }
  .left-panel, .right-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.32s cubic-bezier(0.4,0,0.2,1); }
  .left-panel { z-index: 10; }
  .right-panel { transform: translateX(100%); z-index: 20; }
  body.show-chat-panel .left-panel { transform: translateX(-100%); }
  body.show-chat-panel .right-panel { transform: translateX(0); }
  #backToUsersBtn { display: flex; }
  .message-wrapper { max-width: 85%; }
  .composer-container { padding: 10px 14px 14px; }
  .chat-media { max-width: 220px; }
  #messages { padding: 14px 14px 6px; }
  .chat-header { padding: 12px 16px; }
  .composer-hint { display: none; }
}

@media (max-width: 480px) {
  .login-card { padding: 30px 24px; }
  .message-wrapper { max-width: 90%; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

*:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

</head>
<body data-theme="dark">

<!-- Login View -->
<div id="loginView">
  <div class="login-card">
    <div class="lantern">🐰</div>
    <div class="brand-word">ACCEA</div>
   <div class="brand-tagline">100% fofoca, 0% responsabilidade</div>

    <div class="form-group">
      <label class="field-label" for="usernameLogin">Nome de usuário</label>
      <input id="usernameLogin" class="form-input" placeholder="Digite seu nome" autocomplete="username" />

    <div class="form-group">
      <label class="field-label" for="passLogin">Senha</label>
      <input id="passLogin" class="form-input" type="password" placeholder="Digite sua senha" autocomplete="current-password" />
    </div>
    <button id="loginButton" class="btn-primary">
      <span>Entrar</span><i class="fas fa-arrow-right"></i>
    </button>
  </div>
</div>

<!-- Main Chat View -->
<div id="mainView" style="display: none;">
  <!-- Left Panel -->
  <div class="left-panel">
    <div class="panel-header">
      <div class="header-left">
        <div class="header-logo">🐰</div>
        <div class="header-title">ACCEA</div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="icon-button" title="Toggle theme"><i class="fas fa-moon"></i></button>
        <button id="soundToggle" class="icon-button" title="Toggle sounds"><i class="fas fa-volume-up"></i></button>
        <button id="exportBtn" class="icon-button" title="Export chat"><i class="fas fa-download"></i></button>
      </div>
    </div>

    <div class="me-card">
      <div id="meAvatarWrap" class="me-avatar-wrap" title="Alterar foto de perfil">
        <div id="meAvatar" class="me-avatar"></div>
        <span class="avatar-camera"><i class="fas fa-camera"></i></span>
      </div>
      <input id="profilePhotoInput" type="file" accept="image/*" hidden>
      <div class="me-meta">
        <div id="meName" class="me-name"></div>
        <div id="meRole" class="me-role"></div>
      </div>
      <button id="logoutBtn" class="btn-logout" title="Sign out"><i class="fas fa-sign-out-alt"></i></button>
    </div>

    <div class="search-container">
      <i class="fas fa-magnifying-glass search-icon"></i>
      <input id="searchInput" class="search-input" placeholder="Pesquisar mensagens…" />
      <button id="searchClearBtn" class="search-clear"><i class="fas fa-xmark"></i></button>
      <div id="searchResultCount"></div>
    </div>

    <div class="section-label"><span class="dot"></span>Pessoas (<span id="onlineCount">0</span> online)</div>
    <div id="usersList"></div>

    <div id="adminPanel">
      <div class="admin-title">Ferramentas do administrador</div>

        <input id="newUsername" class="admin-input" placeholder="Nome de usuário" />
        <input id="newPass" class="admin-input" placeholder="Senha" />
      </div>
      <div class="admin-section">
        <button id="addUserBtn" class="btn-small btn-secondary">Adicionar pessoa</button>
        <button id="addAdminBtn" class="btn-small btn-secondary">Adicionar admin</button>
        <button id="clearChatBtn" class="btn-small btn-danger">Limpar conversa</button>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">

    <div class="chat-header">

        <button id="backToUsersBtn" aria-label="Back to people"><i class="fas fa-arrow-left"></i></button>
        <div>
          <div class="room-title">Conversa do grupo</div>
          <div class="room-sub">Todos podem ver esta conversa</div>
        </div>
      </div>
      <div class="chat-actions"></div>
    </div>

    <div class="messages-container">
      <div id="messages"></div>
      <div id="typingIndicator"></div>
      <button id="scrollBottomBtn" class="scroll-bottom-btn" title="Jump to latest">
        <i class="fas fa-arrow-down"></i>
        <span class="scroll-badge"></span>
      </button>
    </div>

    <div class="composer-container">
      <div id="replyContainer">
        <div class="reply-indicator-icon"><i class="fas fa-reply"></i></div>
        <div class="reply-content">
          <div class="reply-author"></div>
          <div class="reply-text"></div>
        </div>
        <button id="clearReplyBtn"><i class="fas fa-times"></i></button>
      </div>

      <div class="composer" id="composer">
        <button id="attachBtn" class="composer-btn" title="Anexar foto ou vídeo"><i class="fas fa-paperclip"></i></button>

        <input type="file" id="fileInput" accept="image/*,video/*" hidden />

        <button id="sendBtn" class="composer-btn" title="Send"><i class="fas fa-paper-plane"></i></button>
      </div>
      <div class="composer-hint"><kbd>**bold**</kbd> <kbd>*italic*</kbd> <kbd>`code`</kbd> <kbd>@name</kbd> · <kbd>Enter</kbd> to send, <kbd>Shift+Enter</kbd> for a new line</div>
    </div>
  </div>
</div>

<!-- GIF Picker -->
<div id="gifPicker" class="gif-picker" aria-hidden="true">
  <div class="gif-picker-header">
    <div class="gif-picker-title"><strong>GIF</strong><span>GIPHY</span></div>
    <button id="gifCloseBtn" class="gif-close" aria-label="Fechar GIFs"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="gif-search-row">
    <i class="fas fa-magnifying-glass"></i>
    <input id="gifSearchInput" type="search" placeholder="Pesquisar GIFs…" autocomplete="off" />
  </div>
  <div id="gifResults" class="gif-results">
    <div class="gif-empty"><i class="fas fa-film"></i><span>Pesquise um GIF</span></div>
  </div>
  <div class="gif-branding">Powered by GIPHY</div>
</div>

<!-- Emoji Picker -->
<div id="emojiPicker"></div>

<!-- Media Modal -->
<div id="mediaModal" class="modal">
  <div class="modal-content">
    <button class="modal-close"><i class="fas fa-times"></i></button>
    <div class="media-content"></div>
  </div>
</div>

</body>

<script>
/* Reforço final: se algum avatar antigo tiver dimensões erradas, normaliza ao carregar. */
(function enforceAvatarSizes(){
  const fix = () => {
    document.querySelectorAll('#meAvatar, .user-avatar, .msg-avatar').forEach(el => {
      const isMsg = el.classList.contains('msg-avatar');
      const size = isMsg ? 26 : (el.id === 'meAvatar' ? 38 : 40);
      el.style.setProperty('width', size + 'px', 'important');
      el.style.setProperty('height', size + 'px', 'important');
      el.style.setProperty('min-width', size + 'px', 'important');
      el.style.setProperty('min-height', size + 'px', 'important');
      el.style.setProperty('max-width', size + 'px', 'important');
      el.style.setProperty('max-height', size + 'px', 'important');
      el.style.setProperty('overflow', 'hidden', 'important');
      const img = el.querySelector(':scope > img.avatar-photo');
      if (img) {
        img.style.setProperty('width','100%','important');
        img.style.setProperty('height','100%','important');
        img.style.setProperty('max-width','100%','important');
        img.style.setProperty('max-height','100%','important');
        img.style.setProperty('object-fit','cover','important');
        img.style.setProperty('position','absolute','important');
        img.style.setProperty('inset','0','important');
      }
    });
  };
  fix();
  new MutationObserver(fix).observe(document.body, {childList:true, subtree:true});
})();
</script>
